name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            build-essential ccache libltdl-dev \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev cmake openjdk-17-jdk

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: |
          .buildozer
          ~/.buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip
        pip install Cython==0.29.36 buildozer

    - name: Build with Buildozer
      shell: bash
      run: buildozer -v android debug 2>&1 | tee build.log

    - name: Ringkasan error (hanya jika gagal)
      if: failure()
      shell: bash
      run: |
        echo "=== Baris error penting ==="
        grep -n -E "error:|Error:|ERROR|FAILED|Command failed|No module named|not found" build.log | grep -v "warning" | tail -40 || true
        echo "=== 60 baris sebelum ENVIRONMENT ==="
        awk '/# ENVIRONMENT:/{exit} {print}' build.log | tail -60 || true

    - name: Upload log build
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: catatuang-apk
        path: bin/*.apk
